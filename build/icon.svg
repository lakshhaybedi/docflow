  <path d="M600 250 V336 a34 34 0 0 0 34 34 H720 Z" fill="#B9D7FF"/>
  <rect x="356" y="430" width="300" height="34" rx="17" fill="url(#mark)" opacity="0.95"/>
  <rect x="356" y="436" width="230" height="22" rx="11" fill="#7A5600" opacity="0.28"/>
  <rect x="356" y="510" width="300" height="22" rx="11" fill="#0A3D91" opacity="0.28"/>
  <rect x="356" y="570" width="260" height="22" rx="11" fill="#0A3D91" opacity="0.28"/>
  <path d="M370 700 C 410 650, 440 735, 480 690 S 560 650, 600 700" fill="none" stroke="#007AFF" stroke-width="16" stroke-linecap="round"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
